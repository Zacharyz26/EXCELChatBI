name: chatbi

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_TOKENS_JSON: ${AUTH_TOKENS_JSON:-}
      MODEL_REGISTRY_PATH: config/models.example.yaml
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-hashing}
      RAG_RERANKER: ${RAG_RERANKER:-lexical}
      RAG_STORE: ${RAG_STORE:-local}
      CHAT_DB_PATH: /var/lib/chatbi/db/chatbi.db
      UPLOAD_DIR: /var/lib/chatbi/uploads
      DATASET_DIR: /var/lib/chatbi/datasets
      REPORT_DIR: /var/lib/chatbi/artifacts
      KB_INDEX_DIR: /var/lib/chatbi/kb/index
      KB_BACKUP_DIR: /var/lib/chatbi/kb/backups
    volumes:
      - chatbi-data:/var/lib/chatbi
    tmpfs:
      - /tmp:size=1g,mode=1777
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  chatbi-data:
