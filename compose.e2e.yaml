services:
  model-stub:
    image: chatbi-python:${CHATBI_IMAGE_TAG:-local}
    build:
      context: .
      target: api
    command:
      [
        "uvicorn",
        "apps.e2e_model.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - app
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
    pids_limit: 128
    cpus: 0.5
    mem_limit: 256m

  api:
    environment:
      MODEL_REGISTRY_PATH: config/models.e2e.yaml
      E2E_MODEL_API_BASE: http://model-stub:8000/v1
      E2E_MODEL_API_KEY: compose-e2e-only
    depends_on:
      model-stub:
        condition: service_healthy
