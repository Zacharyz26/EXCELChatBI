services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    profiles: ["rag"]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - chatbi-milvus-etcd:/etcd
    networks: [app]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["rag"]
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY:?set MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY:?set MILVUS_MINIO_SECRET_KEY}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - chatbi-milvus-minio:/minio_data
    networks: [app]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.20
    profiles: ["rag"]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:?set MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:?set MILVUS_MINIO_SECRET_KEY}
      MQ_TYPE: woodpecker
    volumes:
      - chatbi-milvus-data:/var/lib/milvus
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    networks: [app]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  knowledge-tools:
    image: chatbi-python-rag:${CHATBI_IMAGE_TAG:-local}
    build:
      target: api-rag
    environment:
      RAG_EMBEDDER: bge
      RAG_RERANKER: bge
      RAG_STORE: milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:?set MILVUS_TOKEN}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-kb_chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    depends_on:
      milvus:
        condition: service_healthy

  api:
    image: chatbi-python-rag:${CHATBI_IMAGE_TAG:-local}
    build:
      target: api-rag
    environment:
      RAG_EMBEDDER: bge
      RAG_RERANKER: bge
      RAG_STORE: milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:?set MILVUS_TOKEN}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-kb_chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  chatbi-milvus-etcd:
  chatbi-milvus-minio:
  chatbi-milvus-data:
